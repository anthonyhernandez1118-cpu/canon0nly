<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Canon Only"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Canon Only</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: an iOS-style single column. Sticky blurred search bar, large title, a show card,
   a segmented watch-guide control, then grouped inset lists (Up Next, progress, episodes). */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --label2:#6C6C70; --label3:#AEAEB2; --sep:#D1D1D6;
  --fill:rgba(118,118,128,.12); --blue:#007AFF; --orange:#FF9500; --teal:#30B0C7; --yellow:#FFB800; --filler:#E5E5EA;
  --bar:rgba(242,242,247,.82);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --label2:#98989F; --label3:#636366; --sep:#38383A;
  --fill:rgba(118,118,128,.24); --blue:#0A84FF; --orange:#FF9F0A; --teal:#40C8E0; --yellow:#FFD60A; --filler:#2C2C2E;
  --bar:rgba(0,0,0,.78); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --label2:#98989F; --label3:#636366; --sep:#38383A;
  --fill:rgba(118,118,128,.24); --blue:#0A84FF; --orange:#FF9F0A; --teal:#40C8E0; --yellow:#FFD60A; --filler:#2C2C2E;
  --bar:rgba(0,0,0,.78); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.col{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* search bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--sep)}
.bar .col{padding-block:10px}
.search{position:relative}
.search input{width:100%;height:38px;border:0;border-radius:10px;background:var(--fill);color:var(--label);font:17px var(--font);padding:0 12px 0 34px;outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--label2)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search > svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--label2);pointer-events:none}
.sugg{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 8px);background:var(--card);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.18);max-height:min(60vh,420px);overflow-y:auto}
.sugg button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:8px 14px;cursor:pointer}
.sugg button + button .txt{border-top:.5px solid var(--sep)}
.sugg img{width:32px;height:48px;border-radius:5px;object-fit:cover;flex:none;background:var(--fill)}
.sugg .txt{flex:1;min-width:0;padding-block:6px;display:flex;flex-direction:column;gap:1px;align-self:stretch;justify-content:center}
.sugg .nm{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg .sub{font-size:13px;color:var(--label2)}
.sugg button[aria-selected="true"]{background:var(--fill)}
.sugg .none{padding:16px;color:var(--label2);font-size:15px}

/* titles */
.lt{padding-block:6px 0}
.lt h1{margin:0;font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.01em}
.lt p{margin:2px 0 0;color:var(--label2);font-size:15px}
.sec{margin:28px 0 8px;padding-inline:16px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec .link{text-transform:none;letter-spacing:0;font-size:15px;color:var(--blue);background:none;border:0;padding:0;cursor:pointer}
.foot-note{margin:8px 0 0;padding-inline:16px;font-size:13px;color:var(--label2);line-height:1.4}

/* popular rail */
.rail{display:flex;gap:12px;overflow-x:auto;padding-block:6px 6px;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;width:92px;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start;font-size:13px;line-height:1.25}
.rail img{width:92px;height:138px;border-radius:10px;object-fit:cover;background:var(--fill);transition:transform .2s}
.rail button:active img{transform:scale(.96)}
.rail button[aria-current="true"] img{box-shadow:0 0 0 2.5px var(--bg),0 0 0 5px var(--blue)}
.rail span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* show */
.show-card{display:flex;gap:16px;align-items:center;margin-top:24px}
.show-card img{width:84px;height:126px;border-radius:10px;object-fit:cover;flex:none;background:var(--fill);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.show-card .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.show-card h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.show-card .sub{color:var(--label2);font-size:15px}
.find{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.find a{font-size:13px;font-weight:600;color:var(--blue);background:var(--fill);border-radius:99px;padding:5px 11px;text-decoration:none}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:9px;padding:2px;margin-top:22px;position:relative}
.seg button{border:0;background:none;padding:7px 4px;font-size:13px;font-weight:500;border-radius:7px;cursor:pointer;position:relative;z-index:1;color:var(--label)}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);background:var(--card);border-radius:7px;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .25s cubic-bezier(.3,.7,.4,1)}
.guide-note{margin:8px 4px 0;font-size:13px;color:var(--label2);line-height:1.4}

.group{background:var(--card);border-radius:12px;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:14px 12px 12px 16px;min-width:0}
.stat + .stat{border-left:.5px solid var(--sep)}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--label2)}
.progress{padding:0 16px 14px}
.track{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.track i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
.progress small{display:block;margin-top:6px;font-size:13px;color:var(--label2)}

.next{padding:16px}
.next .eyebrow{font-size:13px;color:var(--label2)}
.next h3{margin:3px 0 0;font-size:20px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.next .badges{margin-top:8px}
.next .acts{display:flex;gap:10px;margin-top:14px}
.btn{border:0;border-radius:10px;padding:11px 12px;white-space:nowrap;font-size:16px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;flex:1;transition:opacity .15s}
.btn:active{opacity:.7}
.btn.tint{background:var(--fill);color:var(--blue)}
.btn[disabled]{opacity:.5}

.bar-strip{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:1px;background:var(--card)}
.bar-strip i{flex:1;min-width:0;background:var(--filler)}
.bar-strip i.on{background:var(--blue)}
.bar-strip i.on.X{background:var(--orange)}.bar-strip i.on.A{background:var(--teal)}.bar-strip i.on.fav{background:var(--yellow)}
.bar-strip i.w{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 4px 0;font-size:12px;color:var(--label2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

.badge{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;border-radius:5px;padding:2px 6px;white-space:nowrap}
.badge.X{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
.badge.A{color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,transparent)}
.badge.fav{color:#9A6B00;background:color-mix(in srgb,var(--yellow) 22%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.fav{color:var(--yellow)}}
:root[data-theme="dark"] .badge.fav{color:var(--yellow)}

ol.eps{list-style:none;margin:0;padding:0}
ol.eps li{display:flex;align-items:center;gap:12px;padding-left:16px;min-height:52px}
ol.eps li .body{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 0;align-self:stretch}
ol.eps li + li .body{border-top:.5px solid var(--sep)}
ol.eps .n{font-size:15px;color:var(--label2);font-variant-numeric:tabular-nums;min-width:30px}
ol.eps .t{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
ol.eps li.done .t{color:var(--label2)}
ol.eps .bdg{display:block;margin-top:4px}
ol.eps li.gap{min-height:0}
ol.eps li.gap .body{justify-content:center;padding:7px 16px 7px 0;font-size:13px;color:var(--label3)}
.ck{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border-radius:50%;border:1.5px solid var(--label3);cursor:pointer;flex:none;display:grid;place-content:center;transition:background .15s,border-color .15s}
.ck::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.ck:checked{background:var(--blue);border-color:var(--blue)}
.ck:checked::after{opacity:1}
.more{display:block;width:100%;border:0;background:var(--card);color:var(--blue);padding:14px;font-size:16px;cursor:pointer;border-top:.5px solid var(--sep)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:16px}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .2s}
.switch:checked{background:#34C759}
.switch:checked::after{transform:translateX(20px)}
.empty,.loading{color:var(--label2);text-align:center;padding:40px 16px;font-size:15px}
footer{padding-block:32px 48px;font-size:13px;color:var(--label2);line-height:1.5;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
footer a{color:var(--blue);text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:rgba(30,30,30,.92);color:#fff;font-size:15px;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="bar" id="bar">
  <div class="col">
    <div class="search" role="combobox" aria-haspopup="listbox" aria-owns="sugg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Search anime" aria-label="Search anime" aria-autocomplete="list" aria-controls="sugg">
      <div class="sugg" id="sugg" role="listbox" hidden></div>
    </div>
  </div>
</div>
<div class="col">
  <div class="lt">
    <h1>Canon Only</h1>
    <p>Just the episodes that matter.</p>
  </div>
  <p class="sec">Popular</p>
  <div class="rail" id="quick"></div>
  <section id="show"><p class="loading">Loading…</p></section>
  <footer>
    <span>Episode data from the community-run <a href="https://www.animefillerlist.com" target="_blank" rel="noopener">Anime Filler List</a>. <span id="updated"></span><br>Your progress is saved on this device.</span>
    <span id="refresh-area"></span>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body></html>
