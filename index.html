<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Canon Only"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/deezy-192.png"><link rel="apple-touch-icon" href="icons/deezy-touch-180.png" sizes="180x180"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Canon Only</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: an iOS-style single column. Sticky blurred search bar, large title, a show card,
   a segmented watch-guide control, then grouped inset lists (Up Next, progress, episodes). */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --label2:#6C6C70; --label3:#AEAEB2; --sep:#D1D1D6;
  --fill:rgba(118,118,128,.12); --blue:#007AFF; --orange:#FF9500; --teal:#30B0C7; --yellow:#FFB800; --filler:#E5E5EA;
  --bar:rgba(242,242,247,.82); --thumb:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --label2:#98989F; --label3:#636366; --sep:#38383A;
  --fill:rgba(118,118,128,.24); --blue:#0A84FF; --orange:#FF9F0A; --teal:#40C8E0; --yellow:#FFD60A; --filler:#2C2C2E;
  --bar:rgba(0,0,0,.78); --thumb:#636366; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --label2:#98989F; --label3:#636366; --sep:#38383A;
  --fill:rgba(118,118,128,.24); --blue:#0A84FF; --orange:#FF9F0A; --teal:#40C8E0; --yellow:#FFD60A; --filler:#2C2C2E;
  --bar:rgba(0,0,0,.78); --thumb:#636366; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
button,input,label,a{touch-action:manipulation}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.col{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* nav bar + tab bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.nav .col{height:44px;display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;align-items:center;gap:8px}
.back{justify-self:start;display:flex;align-items:center;gap:2px;background:none;border:0;padding:6px 0;color:var(--blue);font-size:17px;cursor:pointer;margin-left:-6px}
.nav .ttl{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;text-align:center}
.nav.compact .ttl{opacity:1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;background:none;border:0;color:var(--label3);font-size:10px;font-weight:500;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--blue)}
.tabs svg{width:26px;height:26px}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.view{animation:fade .22s ease-out}
.view.push{animation:push .3s cubic-bezier(.2,.8,.3,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes push{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* search field */
.sfield{position:relative;margin-top:12px}
.sfield input,.sfield .fake{width:100%;height:38px;border:0;border-radius:10px;background:var(--fill);color:var(--label);font:17px var(--font);padding:0 12px 0 34px;outline:none;-webkit-appearance:none;appearance:none;text-align:left;display:flex;align-items:center;cursor:text}
.sfield .fake{color:var(--label2)}
.sfield input::placeholder{color:var(--label2)}
.sfield input::-webkit-search-cancel-button{-webkit-appearance:none}
.sfield svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--label2);pointer-events:none}

/* list rows */
.rows{list-style:none;margin:0;padding:0}
.rows button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:0 0 0 16px;cursor:pointer;min-height:64px}
.rows button:active{background:var(--fill)}
.rows img{width:40px;height:60px;border-radius:6px;object-fit:cover;flex:none;background:var(--fill);margin-block:8px}
.rows .txt{flex:1;min-width:0;display:flex;align-items:center;gap:8px;align-self:stretch;padding-right:14px}
.rows li + li .txt{border-top:.5px solid var(--sep)}
.rows .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rows .nm{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .sub{font-size:14px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .chev{color:var(--label3);flex:none}
.letter{position:sticky;top:calc(44px + env(safe-area-inset-top,0px));z-index:2;background:var(--bg);margin:0;padding:14px 16px 6px;font-size:13px;font-weight:600;color:var(--label2)}
.empty-state{text-align:center;padding:48px 24px;color:var(--label2);font-size:15px;line-height:1.45}
.empty-state b{display:block;color:var(--label);font-size:20px;font-weight:600;margin-bottom:6px}

/* titles */
.lt{padding-block:6px 0}
.lt h1{margin:0;font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.01em}
.lt p{margin:2px 0 0;color:var(--label2);font-size:15px}
.sec{margin:28px 0 8px;padding-inline:16px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec .link{text-transform:none;letter-spacing:0;font-size:15px;color:var(--blue);background:none;border:0;padding:0;cursor:pointer}
.foot-note{margin:8px 0 0;padding-inline:16px;font-size:13px;color:var(--label2);line-height:1.4}

/* popular rail */
.rail{display:flex;gap:12px;overflow-x:auto;padding-block:6px 6px;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;width:92px;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start;font-size:13px;line-height:1.25}
.rail img{width:92px;height:138px;border-radius:10px;object-fit:cover;background:var(--fill);transition:transform .2s}
.rail button:active img{transform:scale(.96)}
.rail small{font-size:12px;color:var(--label2);margin-top:-3px}
.rail span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* show */
.show-card{display:flex;gap:16px;align-items:center;margin-top:8px}
.show-card img{width:84px;height:126px;border-radius:10px;object-fit:cover;flex:none;background:var(--fill);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.show-card .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.show-card h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.show-card .sub{color:var(--label2);font-size:15px}
.find{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.find a{font-size:13px;font-weight:600;color:var(--blue);background:var(--fill);border-radius:99px;padding:5px 11px;text-decoration:none}

.seg{display:grid;grid-template-columns:repeat(2,1fr);background:var(--fill);border-radius:9px;padding:2px;margin-top:22px;position:relative}
.seg button{border:0;background:none;padding:7px 4px;font-size:13px;font-weight:500;border-radius:7px;cursor:pointer;position:relative;z-index:1;color:var(--label)}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/2);background:var(--thumb);border-radius:7px;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .25s cubic-bezier(.3,.7,.4,1)}
.guide-note{margin:8px 4px 0;font-size:13px;color:var(--label2);line-height:1.4}

.group{background:var(--card);border-radius:12px;overflow:hidden}
.next{padding:16px}
.next .eyebrow{font-size:13px;color:var(--label2)}
.next h3{margin:3px 0 0;font-size:20px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.next .badges{margin-top:8px}
.next .acts{display:flex;gap:10px;margin-top:14px}
.btn{border:0;border-radius:10px;padding:11px 12px;white-space:nowrap;font-size:16px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;flex:1;transition:opacity .15s}
.btn:active{opacity:.7}
.btn.tint{background:var(--fill);color:var(--blue)}
.btn[disabled]{opacity:.5}


.badge{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;border-radius:5px;padding:2px 6px;white-space:nowrap}
.badge.X{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
.badge.A{color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,transparent)}
:root[data-theme="dark"] 
ol.eps{list-style:none;margin:0;padding:0}
ol.eps li{display:flex;align-items:center;gap:12px;padding-left:16px;min-height:52px}
ol.eps li .body{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 0;align-self:stretch}
ol.eps li + li .body{border-top:.5px solid var(--sep)}
ol.eps .n{font-size:15px;color:var(--label2);font-variant-numeric:tabular-nums;min-width:30px}
ol.eps .t{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
ol.eps li.done .t{color:var(--label2)}
ol.eps .bdg{display:block;margin-top:4px}
ol.eps li.gap{min-height:0}
ol.eps li.gap .body{justify-content:center;padding:7px 16px 7px 0;font-size:13px;color:var(--label3)}
.ck{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border-radius:50%;border:1.5px solid var(--label3);cursor:pointer;flex:none;display:grid;place-content:center;transition:background .15s,border-color .15s}
.ck::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.ck:checked{background:var(--blue);border-color:var(--blue)}
.ck:checked::after{opacity:1}
.more{display:block;width:100%;border:0;background:var(--card);color:var(--blue);padding:14px;font-size:16px;cursor:pointer;border-top:.5px solid var(--sep)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:16px}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .2s}
.switch:checked{background:#34C759}
.switch:checked::after{transform:translateX(20px)}
.empty,.loading{color:var(--label2);text-align:center;padding:40px 16px;font-size:15px}
footer{padding-block:32px 48px;font-size:13px;color:var(--label2);line-height:1.5;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
footer a{color:var(--blue);text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:rgba(30,30,30,.92);color:#fff;font-size:15px;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* arcs, chapters, manga */
.chap{font-size:12px;color:var(--label2);margin-left:6px;font-variant-numeric:tabular-nums}
.bdg .chap:first-child,.badges .chap:first-child{margin-left:0}
ol.eps li.arc .body{padding:16px 16px 6px 0;font-size:15px;font-weight:600;color:var(--label)}
ol.eps li.arc{min-height:0}
ol.eps li.arc + li .body{border-top:0}
.rows.arcs button{min-height:56px}
.rows .tick{color:#34C759;font-weight:700;font-size:15px;flex:none}
.numin{width:84px;height:32px;border:0;border-radius:8px;background:var(--fill);color:var(--label);font:17px var(--font);text-align:center;outline:none;-moz-appearance:textfield}
.numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.manga-res{margin:0;padding:0 16px 14px;font-size:15px;color:var(--label2);line-height:1.4}
.manga-res b{color:var(--label)}

/* remove: Continue Watching edit mode and Watching swipe */
.nav-act{background:none;border:0;color:var(--blue);font-size:17px;padding:6px 0;cursor:pointer}
.rail button{position:relative}
.rail .x{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;background:var(--label2);color:var(--card);display:grid;place-content:center;font-size:18px;line-height:1;font-weight:600;box-shadow:0 0 0 2px var(--bg);cursor:pointer}
.rail.editing img{animation:jiggle .28s ease-in-out infinite alternate}
.rail.editing button:nth-child(2n) img{animation-delay:-.14s}
@keyframes jiggle{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
li.sw{position:relative;overflow:hidden}
li.sw > button[data-open]{position:relative;z-index:1;background:var(--card);transition:transform .22s cubic-bezier(.3,.7,.4,1)}
li.sw .del{position:absolute;top:0;right:0;bottom:0;width:96px;min-height:0;padding:0;justify-content:center;border:0;background:#FF3B30;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
li.sw.open > button[data-open]{transform:translateX(-96px)}
.toast.has-act{pointer-events:auto}
.toast-act{border:0;background:none;color:#64A8FF;font-size:15px;font-weight:600;margin-left:10px;padding:0;cursor:pointer}

/* action sheet, backup codes, long-press */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0);transition:background .22s;display:flex;align-items:flex-end;justify-content:center;padding:0 max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.sheet-bg.show{background:rgba(0,0,0,.35)}
.sheet{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px;transform:translateY(110%);transition:transform .25s cubic-bezier(.3,.7,.4,1)}
.sheet-bg.show .sheet{transform:none}
.sheet-card{background:var(--card);border-radius:14px;overflow:hidden}
.sheet-head{padding:14px 18px 12px;text-align:center;border-bottom:.5px solid var(--sep)}
.sheet-title{margin:0;font-size:13px;font-weight:600;color:var(--label2)}
.sheet-msg{margin:4px 0 0;font-size:13px;color:var(--label2);line-height:1.4}
.sheet-btn{display:block;width:100%;border:0;background:var(--card);color:var(--blue);font-size:19px;padding:16px;cursor:pointer;border-top:.5px solid var(--sep)}
.sheet-card .sheet-btn:first-child{border-top:0}
.sheet-head + .sheet-btn,.sheet-head + textarea{border-top:0}
.sheet-btn:active{background:var(--fill)}
.sheet-btn.destructive{color:#FF3B30}
.sheet-cancel{border-radius:14px;font-weight:600;border-top:0}
textarea.code{display:block;width:calc(100% - 32px);margin:12px 16px;height:96px;border:0;border-radius:10px;background:var(--fill);color:var(--label);font:13px ui-monospace,"SF Mono",Menlo,monospace;padding:10px 12px;resize:none;outline:none;word-break:break-all}
.sheet-err{margin:-4px 16px 12px;font-size:13px;color:#FF3B30}
.rows.plain button{min-height:60px}
ol.eps li[data-ep]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:background .15s}
ol.eps li.pressed{background:var(--fill)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="nav" id="nav">
  <div class="col">
    <span><button class="back" id="back" hidden aria-label="Back"><svg width="13" height="21" viewBox="0 0 13 21" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2 2.5 10.5l8 8.5"/></svg>Back</button></span>
    <span class="ttl" id="ttl"></span>
    <span style="justify-self:end"><button class="nav-act" id="nav-act" hidden>Edit</button></span>
  </div>
</div>

<main class="col">
  <section class="view" id="v-home">
    <div class="lt"><h1>Canon Only</h1><p>Just the episodes that matter.</p></div>
    <div class="sfield"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg><button class="fake" id="home-search">Search anime</button></div>
    <div id="continue"></div>
    <p class="sec">Popular</p>
    <div class="rail" id="quick"></div>
    <footer>
      <span>Episode data from the community-run <a href="https://www.animefillerlist.com" target="_blank" rel="noopener">Anime Filler List</a>. Story arcs and manga chapters from the One Piece Wiki, Narutopedia and Bleach Wiki on Fandom, shared under <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA</a>. <span id="updated"></span><br>Your progress is saved on this device.</span>
      <span id="refresh-area"></span>
    </footer>
  </section>

  <section class="view" id="v-watching" hidden>
    <div class="lt"><h1>Watching</h1></div>
    <div id="watching-list"></div>
  </section>

  <section class="view" id="v-search" hidden>
    <div class="lt"><h1>Search</h1></div>
    <div class="sfield"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg><input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Search anime" aria-label="Search anime"></div>
    <div id="results"></div>
  </section>

  <section class="view push" id="v-show" hidden>
    <div id="show"></div>
  </section>
</main>

<nav class="tabs" aria-label="Tabs">
  <div class="in">
    <button data-tab="home" aria-current="page">
      <svg viewBox="0 0 28 28" fill="currentColor"><path d="M14 3.2 2.6 13a1 1 0 0 0 1.3 1.5L5 13.6V23a2 2 0 0 0 2 2h4.5v-6.5h5V25H21a2 2 0 0 0 2-2v-9.4l1.1.9a1 1 0 0 0 1.3-1.5Z"/></svg>Home</button>
    <button data-tab="watching">
      <svg viewBox="0 0 28 28" fill="currentColor"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3h13A2.5 2.5 0 0 1 23 5.5v12a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 5 17.5Zm7 3.1v6.8a.6.6 0 0 0 .9.5l5.4-3.4a.6.6 0 0 0 0-1l-5.4-3.4a.6.6 0 0 0-.9.5ZM8 23h12a1 1 0 0 1 0 2H8a1 1 0 0 1 0-2Z"/></svg>Watching</button>
    <button data-tab="search">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12.5" cy="12.5" r="7.5"/><path d="m23.5 23.5-5.6-5.6"/></svg>Search</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body></html>
